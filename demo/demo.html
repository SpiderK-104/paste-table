<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paste-Table 转换 Demo</title>
<style>
	:root {
		--border: #d4d4d8;
		--bg: #fafafa;
		--text: #1f2937;
		--muted: #6b7280;
		--accent: #2563eb;
		--accent-hover: #1d4ed8;
	}
	* { box-sizing: border-box; }
	body {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
			"Microsoft YaHei", sans-serif;
		color: var(--text);
		background: var(--bg);
		margin: 0;
		padding: 24px;
	}
	.wrap {
		max-width: 1100px;
		margin: 0 auto;
	}
	h1 { font-size: 20px; margin: 0 0 4px; }
	p.sub {
		color: var(--muted);
		font-size: 13px;
		margin: 0 0 20px;
	}
	.grid {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 16px;
	}
	@media (max-width: 860px) {
		.grid { grid-template-columns: 1fr; }
	}
	.card {
		background: #fff;
		border: 1px solid var(--border);
		border-radius: 8px;
		padding: 16px;
	}
	.card h2 {
		font-size: 14px;
		margin: 0 0 10px;
	}
	textarea {
		width: 100%;
		height: 320px;
		font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
		font-size: 13px;
		line-height: 1.5;
		padding: 10px;
		border: 1px solid var(--border);
		border-radius: 6px;
		resize: vertical;
		white-space: pre;
	}
	.output-box {
		width: 100%;
		min-height: 320px;
		font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
		font-size: 13px;
		line-height: 1.6;
		padding: 10px;
		border: 1px solid var(--border);
		border-radius: 6px;
		background: #0f172a;
		color: #e2e8f0;
		white-space: pre-wrap;
		word-break: break-all;
	}
	.preview {
		margin-top: 12px;
		border: 1px solid var(--border);
		border-radius: 8px;
		overflow-x: auto;
		background: #fff;
		padding: 12px;
	}
	.preview table {
		border-collapse: collapse;
		width: 100%;
	}
	.preview th, .preview td {
		border: 1px solid var(--border);
		padding: 8px 12px;
		text-align: left;
		font-size: 13px;
	}
	.preview th {
		background: #f1f5f9;
		font-weight: 600;
	}
	.preview .note {
		color: var(--muted);
		font-size: 12px;
		margin-bottom: 10px;
	}
	.detected {
		display: inline-block;
		font-size: 12px;
		padding: 3px 8px;
		border-radius: 99px;
		margin-bottom: 8px;
	}
	.detected.yes { background: #dcfce7; color: #166534; }
	.detected.no { background: #fee2e2; color: #991b1b; }
	.controls {
		display: flex;
		align-items: center;
		gap: 12px;
		margin-top: 12px;
		flex-wrap: wrap;
	}
	button {
		background: var(--accent);
		color: #fff;
		border: none;
		border-radius: 6px;
		padding: 8px 14px;
		font-size: 13px;
		cursor: pointer;
	}
	button:hover { background: var(--accent-hover); }
	button.secondary {
		background: #fff;
		color: var(--text);
		border: 1px solid var(--border);
	}
	button.secondary:hover { background: #f1f5f9; }
	label {
		font-size: 12px;
		color: var(--muted);
		display: flex;
		align-items: center;
		gap: 4px;
	}
	input[type="text"], input[type="number"] {
		width: 60px;
		padding: 4px 6px;
		border: 1px solid var(--border);
		border-radius: 4px;
		font-size: 12px;
	}
	input[type="text"] { width: 80px; }
	input[type="checkbox"] { accent-color: var(--accent); }
	select {
		padding: 4px 6px;
		border: 1px solid var(--border);
		border-radius: 4px;
		font-size: 12px;
	}
	.status { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
	<h1>Paste-Table 转换 Demo</h1>
	<p class="sub">
		这是插件 <code>src/text-converter.ts</code> 的真实逻辑（由 esbuild 打包，非手抄副本）。
		把从 AI 复制的表格文本（Tab / 空格对齐 / Markdown）粘贴到左侧，即可看到转换结果。
		逻辑与插件完全一致，可先在此验证后再装插件。
	</p>

	<div class="grid">
		<div class="card">
			<h2>输入：粘贴从 AI 复制的表格</h2>
			<textarea id="input" spellcheck="false"></textarea>
			<div class="controls">
				<button id="convertBtn">转换</button>
				<button class="secondary" id="sampleBtn">填入 Tab 示例</button>
				<button class="secondary" id="spaceSampleBtn">填入空格示例</button>
				<button class="secondary" id="clearBtn">清空</button>
			</div>
			<div class="controls">
				<label><input type="checkbox" id="showRowNumber" /> 数字排序列</label>
				<label>最小空格数
					<input type="number" id="spaceMinGap" value="2" min="1" />
				</label>
			</div>
		</div>

		<div class="card">
			<h2>转换结果</h2>
			<span class="detected" id="detected">请先转换</span>
			<div class="output-box" id="output"></div>
			<div class="controls">
				<button class="secondary" id="copyBtn">复制 Markdown</button>
			</div>
			<div class="status" id="status"></div>
		</div>
	</div>

	<div class="card preview" id="previewCard" hidden>
		<h2>预览：Markdown 渲染效果</h2>
		<div class="note">从上图中复制 Markdown 粘贴到本页底部临时区域即可看到同样的渲染（此处展示 Obsidian 中的渲染效果示意）。</div>
		<div id="preview"></div>
	</div>
</div>

<script src="./demo-converter.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// 与插件 DEFAULT_SETTINGS 一致的默认值
const settings = {
	showRowNumber: false,
	spaceMinGap: 2,
};

const TAB_SAMPLE = `能力	用到的指令	场景
缓存对象	SET / GET / EXPIRE	用户信息、配置、session
批量缓存	MSET / MGET	减少网络往返
计数器	INCR / INCRBY	阅读量、限流
分布式锁	SET NX EX	防止重复提交、抢单
排行榜	ZADD / ZRANGE / ZREVRANGE	积分榜、热度排序
去重	SADD / SISMEMBER	点赞、签到、黑名单
简单队列	LPUSH / BRPOP	异步任务、消息通知
查key	KEYS / SCAN / TTL / DEL	运维排查`;

const SPACE_SAMPLE = `配置项          方法                              默认值
最小工作线程数   minWorkerThreads(int)             5
最大工作线程数   maxWorkerThreads(int)             Integer.MAX_VALUE
线程保活时间     stopTimeoutVal(int) + stopTimeoutUnit(TimeUnit)   60 秒
连接最大空闲时间 connectionMaxIdleTime(long)       -`;

function readSettings() {
	settings.showRowNumber = $('showRowNumber').checked;
	settings.spaceMinGap = parseInt($('spaceMinGap').value, 10) || 2;
}

function convert() {
	readSettings();
	const text = $('input').value;
	const isTable = PT.looksLikeTable(text, settings);
	const badge = $('detected');
	badge.textContent = isTable ? '检测到表格结构' : '未检测到表格，按原文处理';
	badge.className = 'detected ' + (isTable ? 'yes' : 'no');

	let out;
	try {
		out = isTable ? PT.textToMarkdown(text, settings) : text;
	} catch (e) {
		out = '转换失败: ' + e.message;
	}
	$('output').textContent = out;
	renderPreview(out, isTable);
	$('status').textContent = 'settings: showRowNumber=' + settings.showRowNumber +
		', spaceMinGap=' + settings.spaceMinGap;
}

function renderPreview(md, isTable) {
	const card = $('previewCard');
	const el = $('preview');
	if (!isTable) {
		card.hidden = true;
		return;
	}
	// 简单 Markdown 表格 → HTML（仅 demo 用，识别 | 分隔行与分隔线）
	const lines = md.split('\n');
	const rows = [];
	for (const line of lines) {
		const t = line.trim();
		// 跳过空行与 HTML 包裹
		if (!t || t.startsWith('<')) continue;
		if (/^\|[\s\-:|]+\|?$/.test(t)) continue; // 分隔线
		const cells = t.split('|').map((c) => c.trim()).filter((c) => c.length > 0);
		if (cells.length > 0) rows.push(cells);
	}
	if (rows.length === 0) {
		card.hidden = true;
		return;
	}
	card.hidden = false;
	let html = '<table>';
	rows.forEach((r, i) => {
		const tag = i === 0 ? 'th' : 'td';
		html += '<tr>' + r.map((c) => '<' + tag + '>' + c + '</' + tag + '>').join('') + '</tr>';
	});
	html += '</table>';
	el.innerHTML = html;
}

$('convertBtn').addEventListener('click', convert);
$('sampleBtn').addEventListener('click', () => { $('input').value = TAB_SAMPLE; convert(); });
$('spaceSampleBtn').addEventListener('click', () => { $('input').value = SPACE_SAMPLE; convert(); });
$('clearBtn').addEventListener('click', () => { $('input').value = ''; $('output').textContent = ''; $('detected').textContent = '请先转换'; $('detected').className = 'detected'; $('previewCard').hidden = true; });
$('copyBtn').addEventListener('click', () => {
	void navigator.clipboard.writeText($('output').textContent).then(() => {
		const b = $('copyBtn');
		b.textContent = '已复制!';
		window.setTimeout(() => { b.textContent = '复制 Markdown'; }, 1200);
	});
});

$('sampleBtn').click();
</script>
</body>
</html>
